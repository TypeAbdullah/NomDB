[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nomdb"
version = "0.1.1"
description = "Production-grade in-memory key-value database with persistence, transactions, and web dashboard."
readme = "README.md"
authors = [{ name = "NomDB Team" }]
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
nomdb-server = "nomdb.server.server:main"
nomdb-cli = "nomdb.cli.repl:main"
nomdb-benchmark = "nomdb.benchmark.runner:main"
nomdb-dashboard = "nomdb.dashboard.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
